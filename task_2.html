<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 2</title>
</head>
<body>

    <h2>Conference Registration Form</h2>

    <form action="#" method="post">
        Full Name:<br>
        <input type="text" name="fullname" placeholder="Enter your full name" required><br><br>

        Email Address:<br>
        <input type="email" name="email" placeholder="Enter your email addres" required><br><br>

        Age:<br>
        <input type="number" name="age" min="18" max="99" value="18" required><br><br>

        Gender:<br><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        Country of Residence:<br>
        <select name="country">
            <option value="Malaysia" selected>Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
        </select><br><br>

        Areas of Interest:<br><br>
        <input type="checkbox" id="software" name="interest" value="Software Development">
        <label for="software">Software Development</label><br>
        <input type="checkbox" id="data_science" name="interest" value="Data Science">
        <label for="data_science">Data Science</label><br>
        <input type="checkbox" id="cybersecurity" name="interest" value="Cybersecurity">
        <label for="cybersecurity">Cybersecurity</label><br>
        <input type="checkbox" id="ai" name="interest" value="Artificial Intelligence">
        <label for="ai">Artificial Intelligence</label><br><br>

        Experience Level:<br><br>
        <input type="radio" id="beginner" name="experience" value="Beginner">
        <label for="beginner">Beginner</label><br>
        <input type="radio" id="intermediate" name="experience" value="Intermediate">
        <label for="intermediate">Intermediate</label><br>
        <input type="radio" id="advanced" name="experience" value="Advanced">
        <label for="advanced">Advanced</label><br><br>

        Comments or Questions:<br>
        <textarea name="comments" rows="4" cols="50" placeholder="Any comments or questions?"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
